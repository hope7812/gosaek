  <style>

    /* =========================
       RESET
    ========================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins', sans-serif;
      background:#f7f7f7;
      color:#111;
      min-height:100vh;
      overflow-x:hidden;
    }

    /* =========================
       배경 스트라이프
    ========================== */

    body::before{
      content:"";
      position:fixed;
      top:0;
      left:0;
      width:140px;
      height:140px;

      background:
      repeating-linear-gradient(
        -45deg,
        #000 0px,
        #000 18px,
        #fff 18px,
        #fff 36px
      );

      clip-path:polygon(
        0 0,
        100% 0,
        0 100%
      );

      z-index:0;
    }

    body::after{
      content:"";
      position:fixed;
      bottom:0;
      right:0;
      width:140px;
      height:140px;

      background:
      repeating-linear-gradient(
        -45deg,
        #000 0px,
        #000 18px,
        #fff 18px,
        #fff 36px
      );

      clip-path:polygon(
        100% 0,
        100% 100%,
        0 100%
      );

      z-index:0;
    }

    /* =========================
       LAYOUT
    ========================== */

    .container{
      width:100%;
      max-width:1200px;
      margin:auto;
      padding:40px 30px 60px;
      position:relative;
      z-index:2;
    }

    /* =========================
       TITLE
    ========================== */

    .title-banner{
      position:relative;
      background:#fff6b7;
      border:3px solid #111;
      padding:24px 40px;
      text-align:center;
      margin-bottom:60px;

      clip-path:polygon(
        0 0,
        95% 0,
        100% 50%,
        95% 100%,
        0 100%,
        5% 50%
      );

      box-shadow:10px 10px 0 #ffc7d2;
    }

    .title-banner h1{
      font-size:4rem;
      font-weight:800;
      letter-spacing:-2px;
    }

    .title-banner span{
      color:#ef6c8f;
    }

    /* =========================
       GRID
    ========================== */

    .portfolio-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:40px;
    }

    /* =========================
       CARD
    ========================== */

    .card{
      background:#fff;
      border:3px solid #111;
      border-radius:18px;
      overflow:hidden;
      position:relative;

      box-shadow:10px 10px 0 #ffc7d2;

      transition:0.25s ease;
    }

    .card:hover{
      transform:translate(-6px,-6px);

      box-shadow:
      16px 16px 0 #ff9db5;
    }

    /* 카드 링크 */

    .card-link{
      display:block;
      width:100%;
      height:100%;
      color:inherit;
      text-decoration:none;
    }

    .card-link:hover{
      opacity:0.97;
    }

    /* 카드 번호 */

    .card-number{
      position:absolute;
      top:14px;
      left:14px;

      background:#ef6c8f;
      color:white;

      font-size:1rem;
      font-weight:700;

      padding:4px 14px;
      border-radius:999px;

      z-index:5;
    }

    /* 이미지 */

    .card-image{
      width:100%;
      height:200px;
      background:#ececec;
      overflow:hidden;
    }

    .card-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* 내용 */

    .card-content{
      padding:22px;
    }

    .card-date{
      font-size:2rem;
      font-weight:700;
      margin-bottom:14px;
    }

    .line{
      width:100%;
      height:2px;

      background:
      repeating-linear-gradient(
        to right,
        #ffb0c1 0px,
        #ffb0c1 6px,
        transparent 6px,
        transparent 12px
      );

      margin-bottom:16px;
    }

    .card-desc{
      color:#666;
      line-height:1.7;
      font-size:0.98rem;
    }

    /* =========================
       FOOTER
    ========================== */

    footer{
      margin-top:70px;

      background:#fff8d4;

      border:3px solid #111;

      padding:20px;

      text-align:center;

      font-size:1.8rem;
      font-weight:600;

      box-shadow:10px 10px 0 #ffc7d2;
    }

    footer span{
      color:#ef6c8f;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media(max-width:1000px){

      .portfolio-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .title-banner h1{
        font-size:3rem;
      }

    }

    @media(max-width:700px){

      .portfolio-grid{
        grid-template-columns:1fr;
      }

      .title-banner h1{
        font-size:2.2rem;
      }

      footer{
        font-size:1.2rem;
      }

    }

  </style>
</head>
