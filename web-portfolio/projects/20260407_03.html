<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>절대 배치</title>

<style>
    div {display: inline-block;
        position: absolute;
        border: 1px solid lightgray;

    }
    div > p {
        display: inline-block;
        position: absolute;
        height: 20px;
        width: 15px;
        background: lightgray;
    }
    /* #fixed {
        position: fixed;
        bottom: 10px;
        right: 10px;
        width: 100px;
        padding: 5px;
        background: red;
        color: white;
    } */
     #fixed {
        float: right;
        border: 1px solid black;
        width: 8em;
        padding: 0.25em;
        margin: 1em;
     }
     .top-header{
          width:100%;
          background:#fff;
          padding:18px 20px 10px;
        }

        .header-inner{
          display:flex;
          justify-content:space-between;
          align-items:center;
        }

        .back-btn{
          background:#bdbdbd;
          color:#555;
          border:none;
          border-radius:10px;
          padding:12px 18px;
         font-size:16px;
         font-weight:600;
         cursor:pointer;
        }

        .title{
          font-size:20px;
          font-weight:700;
          color:#111;
        }

     .dashed-line{
         margin-top:10px;
         border-bottom:2px dashed #bdbdbd;
        }
</style>

</head>

<body>

    <div class="top-header">

    <div class="header-inner">

        <button class="back-btn" onclick="location.href='../index.html'">
        ← 메인페이지
        </button>

        <div class="title">
          4월 07일 파일
        </div>

    </div>

    <div class="dashed-line"></div>

    </div>

<h3>Merry Christmas!</h3>

<hr>

<p id="fixed">예수님이 탄생하셨습니다.</p>

<div>

	<img src="../image/christmastree.png"
			width="200" height="200" alt="크리스마스 트리">
	<p style="left:50px; top:30px">M</p>
	<p style="left:100px; top:0px">E</p>
	<p style="left:100px; top:80px">R</p>
	<p style="left:150px; top:110px">R</p>
	<p style="left:30px; top:130px">Y</p>

</div>

</body>

</html>
