<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>z-index 프로퍼티</title>

<style>
    div{position:absolute;}
    img {position: absolute;}
    #spadeA{z-index: -3; left:10px; top: 20px;}
    #spade2{z-index: 2; left:40px; top: 30px;}
    #spade3{z-index: 3; left:70px; top: 40px;}
    #spade7{z-index: 4; left:100px; top: 50px;}
	.top-header{
          width:100%;
          background:#fff;
          padding:18px 20px 10px;
        }

        .header-inner{
          display:flex;
          justify-content:space-between;
          align-items:center;
        }

        .back-btn{
          background:#bdbdbd;
          color:#555;
          border:none;
          border-radius:10px;
          padding:12px 18px;
         font-size:16px;
         font-weight:600;
         cursor:pointer;
        }

        .title{
          font-size:20px;
          font-weight:700;
          color:#111;
        }

     .dashed-line{
         margin-top:10px;
         border-bottom:2px dashed #bdbdbd;
        }

</style>

</head>

<body>

    <div class="top-header">

    <div class="header-inner">

        <button class="back-btn" onclick="location.href='../index.html'">
        ← 메인페이지
        </button>

        <div class="title">
          4월 07일 파일
        </div>

    </div>

    <div class="dashed-line"></div>

    </div>

<h3>z-index 프로퍼티</h3>

<hr>

<div>

	<img id="spadeA" src="../image/spade_A.png"

		width="100" height="140" alt="스페이드A">

	<img id="spade2" src="../image/spade_2.png"

		width="100" height="140" alt="스페이드2">

	<img id="spade3" src="../image/spade_3.png"

		width="100" height="140" alt="스페이드3">

	<img id="spade7" src="../image/spade_7.png"

		width="100" height="140" alt="스페이드7">

</div>

</body>

</html>
