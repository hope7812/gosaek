<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <style>
            #content {
                width: 300px;
            }
            ul li {
                list-style: none;
                border: 1px solid #cccccc;
                padding: 10px;
                background-color: #efefef;
                font-weight: bold;
                font-size: 20px;
            }
            ul li a {
                color: #000000;
            }
            ul li:nth-child(odd) { /*even, 2n+1*/
                background-color: #de9393;
            }
            ul li:first-child, ul li:last-child {
                background-color: yellow;
            }
            ul li:first-child {
                border-radius: 10px 20px 0px 0px;
            }
            ul li:last-child {
                border-radius: 0px 0px 10px 10px;
            }
            .top-header{
          width:100%;
          background:#fff;
          padding:18px 20px 10px;
        }

        .header-inner{
          display:flex;
          justify-content:space-between;
          align-items:center;
        }

        .back-btn{
          background:#bdbdbd;
          color:#555;
          border:none;
          border-radius:10px;
          padding:12px 18px;
         font-size:16px;
         font-weight:600;
         cursor:pointer;
        }

        .title{
          font-size:20px;
          font-weight:700;
          color:#111;
        }

        .dashed-line{
         margin-top:10px;
         border-bottom:2px dashed #bdbdbd;
        }
        
        </style>
    </head>
    <body>

    <div class="top-header">

    <div class="header-inner">

        <button class="back-btn" onclick="location.href='../index.html'">
        ← 메인페이지
        </button>

        <div class="title">
          3월 31일 파일
        </div>

    </div>

    <div class="dashed-line"></div>

    </div>

</html>
