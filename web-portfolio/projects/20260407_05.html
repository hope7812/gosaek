<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>애니메이션</title>

<style>
    @keyframes text {
        0% {font-size: 500px;}
        100%{font-size: 100px;}
    }
    h3{
        animation-name: text;
        animation-duration: 3s;
        animation-iteration-count: infinite;
    }
    .top-header{
          width:100%;
          background:#fff;
          padding:18px 20px 10px;
        }

        .header-inner{
          display:flex;
          justify-content:space-between;
          align-items:center;
        }

        .back-btn{
          background:#bdbdbd;
          color:#555;
          border:none;
          border-radius:10px;
          padding:12px 18px;
         font-size:16px;
         font-weight:600;
         cursor:pointer;
        }

        .title{
          font-size:20px;
          font-weight:700;
          color:#111;
        }

     .dashed-line{
         margin-top:10px;
         border-bottom:2px dashed #bdbdbd;
        }
</style>

</head>

<body>

    <div class="top-header">

    <div class="header-inner">

        <button class="back-btn" onclick="location.href='../index.html'">
        ← 메인페이지
        </button>

        <div class="title">
          4월 07일 파일
        </div>

    </div>

    <div class="dashed-line"></div>

    </div>

<h3>꽝!</h3>

<hr>

<p>꽝! 글자가 3초동안 500%에서

시작하여 100%로 바뀌는

애니메이션입니다. 무한 반복합니다.</p>

</body>

</html>
