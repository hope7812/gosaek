<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>애니메이션</title>
<style>
    @keyframes quest {
        0% {margin-left: 0px; margin-right: 98%;}
        50% {margin-left: 98%; margin-right: 0px;}
        100% {margin-left: 0px; margin-right: 98%;}
    }
    p {
        animation-name: quest;
        animation-duration: 1s;
        animation-iteration-count: infinite;
    }
    .top-header{
          width:100%;
          background:#fff;
          padding:18px 20px 10px;
        }

        .header-inner{
          display:flex;
          justify-content:space-between;
          align-items:center;
        }

        .back-btn{
          background:#bdbdbd;
          color:#555;
          border:none;
          border-radius:10px;
          padding:12px 18px;
         font-size:16px;
         font-weight:600;
         cursor:pointer;
        }

        .title{
          font-size:20px;
          font-weight:700;
          color:#111;
        }

     .dashed-line{
         margin-top:10px;
         border-bottom:2px dashed #bdbdbd;
        }
</style>

</head>
<body>

    <div class="top-header">

    <div class="header-inner">

        <button class="back-btn" onclick="location.href='../index.html'">
        ← 메인페이지
        </button>

        <div class="title">
          4월 07일 파일
        </div>

    </div>

    <div class="dashed-line"></div>

    </div>
<h3>애니메이션 응용</h3>
<hr>
<p><img src="media/question.png">
	질문 있습니다.</p>
</body>
</html>
