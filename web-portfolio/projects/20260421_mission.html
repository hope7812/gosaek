<body>

    </div>

<h3>star</h3>

<hr>

<script>

	let star;

	let count = prompt("별의 개수");

	count = parseInt(count); // 문자열을 숫자로 바꿈

	// 이곳에 자바스크립트 코드를 작성하라.
    if (isNaN(count)) document.write("입력을 잘 못 하셨습니다");
    else if (count<=0) document.write("입력을 잘 못 하셨습니다"); 
    
	else 
        for (let p=1; p<=count ; p+=1) {
            document.write("<br>")
            for (let q=1; q<=p ; q+=1){
                document.write("*")
            }
        }

</script>
