<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>URL에 자바스크립트 작성</title>
<style>
    .top-header{
          width:100%;
          background:#fff;
          padding:18px 20px 10px;
        }

        .header-inner{
          display:flex;
          justify-content:space-between;
          align-items:center;
        }

        .back-btn{
          background:#bdbdbd;
          color:#555;
          border:none;
          border-radius:10px;
          padding:12px 18px;
         font-size:16px;
         font-weight:600;
         cursor:pointer;
        }

        .title{
          font-size:20px;
          font-weight:700;
          color:#111;
        }

     .dashed-line{
         margin-top:10px;
         border-bottom:2px dashed #bdbdbd;
        }
</style>

</head>

<body>

    <div class="top-header">

    <div class="header-inner">

        <button class="back-btn" onclick="location.href='../index.html'">
        ← 메인페이지
        </button>

        <div class="title">
          4월 21일 파일
        </div>

    </div>

    <div class="dashed-line"></div>

    </div>

<h3>링크의 href에 자바스크립트 작성</h3>

<hr>

<a href="javascript:confirm('클릭하셨어요?')">클릭해보세요</a>

</body>

</html>
